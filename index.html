<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-World AI Scenarios & Case Studies – Finance & Audit</title>
  <meta name="description" content="In-depth real-world enterprise AI case studies in finance and audit, featuring commercial contract intelligence, 100% GL audit surveillance, and autonomous finance.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      
      <!-- Brand & Title -->
      <div class="brand-section">
        <div class="brand-icon">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
        </div>
        <div class="brand-titles">
          <h1>AI Real-World Scenarios</h1>
          <div class="brand-subtitle">Enterprise Industry Case Studies & Targeted Knowledge Quizzes</div>
        </div>
      </div>

      <!-- Navigation Links -->
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <a href="Real_Life_AI_Scenarios.pdf" download="Real_Life_AI_Scenarios.pdf" class="btn-back-main" style="background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #a7f3d0;" title="Download Full Real-World Scenarios PDF Manual">
          <span>📑</span> Download PDF Manual
        </a>
        <a href="https://archita14singh.github.io/prompt-engineering-workshop/" target="_blank" class="btn-back-main" title="Switch to Lab 1: Prompt Engineering Workshop">
          <span>⚡</span> Lab 1: Prompt Workshop
        </a>
        <a href="https://archita14singh.github.io/genai-model-training-lab/" target="_blank" class="btn-back-main" title="Switch to Lab 2: AI Model Training Lab">
          <span>🤖</span> Lab 2: Model Training
        </a>
        <a href="https://github.com/Archita14Singh/real-life-scenarios-finance-audit" target="_blank" rel="noopener noreferrer" class="btn-back-main" title="View Source Code on GitHub">
          <span>⭐</span> GitHub
        </a>
      </div>

    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="main-content">
    
    <!-- Scenario Selection Tabs -->
    <div id="scenario-tabs-container" class="scenario-nav-tabs">
      <!-- Populated dynamically by app.js -->
    </div>

    <!-- Active Scenario Details & Quiz -->
    <div id="active-scenario-view" class="screen-only-view">
      <!-- Populated dynamically by app.js -->
    </div>

    <!-- Print All Scenarios View (for PDF export & printing) -->
    <div id="print-all-scenarios-view" class="print-only-view" style="display: none;">
      <!-- Populated dynamically with all 3 scenarios by app.js -->
    </div>

  </main>

  <!-- Global SVG Marker Definitions -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
      </marker>
    </defs>
  </svg>

  <!-- Scripts -->
  <script src="js/scenariosData.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
